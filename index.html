<script>
// ---------- DATA ----------
const flags = {
'Mexico':'🇲🇽','South Africa':'🇿🇦','South Korea':'🇰🇷','Czech Republic':'🇨🇿',
'Canada':'🇨🇦','Bosnia and Herzegovina':'🇧🇦','Qatar':'🇶🇦','Switzerland':'🇨🇭',
'Brazil':'🇧🇷','Morocco':'🇲🇦','Haiti':'🇭🇹','Scotland':'🏴󠁧󠁢󠁳󠁣󠁴󠁿',
'United States':'🇺🇸','Paraguay':'🇵🇾','Australia':'🇦🇺','Turkey':'🇹🇷',
'Germany':'🇩🇪','Curaçao':'🇨🇼','Ivory Coast':'🇨🇮','Ecuador':'🇪🇨',
'Netherlands':'🇳🇱','Japan':'🇯🇵','Sweden':'🇸🇪','Tunisia':'🇹🇳',
'Belgium':'🇧🇪','Egypt':'🇪🇬','Iran':'🇮🇷','New Zealand':'🇳🇿',
'Spain':'🇪🇸','Cape Verde':'🇨🇻','Saudi Arabia':'🇸🇦','Uruguay':'🇺🇾',
'France':'🇫🇷','Senegal':'🇸🇳','Iraq':'🇮🇶','Norway':'🇳🇴',
'Argentina':'🇦🇷','Algeria':'🇩🇿','Austria':'🇦🇹','Jordan':'🇯🇴',
'Portugal':'🇵🇹','DR Congo':'🇨🇩','Uzbekistan':'🇺🇿','Colombia':'🇨🇴',
'England':'🏴󠁧󠁢󠁥󠁮󠁧󠁿','Croatia':'🇭🇷','Ghana':'🇬🇭','Panama':'🇵🇦'
};

const groups = [
{name:'A',teams:['Mexico','South Africa','South Korea','Czech Republic']},
{name:'B',teams:['Canada','Bosnia and Herzegovina','Qatar','Switzerland']},
{name:'C',teams:['Brazil','Morocco','Haiti','Scotland']},
{name:'D',teams:['United States','Paraguay','Australia','Turkey']},
{name:'E',teams:['Germany','Curaçao','Ivory Coast','Ecuador']},
{name:'F',teams:['Netherlands','Japan','Sweden','Tunisia']},
{name:'G',teams:['Belgium','Egypt','Iran','New Zealand']},
{name:'H',teams:['Spain','Cape Verde','Saudi Arabia','Uruguay']},
{name:'I',teams:['France','Senegal','Iraq','Norway']},
{name:'J',teams:['Argentina','Algeria','Austria','Jordan']},
{name:'K',teams:['Portugal','DR Congo','Uzbekistan','Colombia']},
{name:'L',teams:['England','Croatia','Ghana','Panama']}
];

const pairings = [[0,1],[2,3],[1,3],[0,2],[3,0],[2,1]];

// Actual MYT times from worldcuplocaltime.com
// Format: [gi][mi] = "Jun DD HH:MM AM/PM MYT"
const MATCH_TIMES = [
  // Group A: Jun 12, 19, 25
  ['Jun 12 · 3:00 AM MYT','Jun 12 · 10:00 AM MYT','Jun 19 · 12:00 AM MYT','Jun 19 · 9:00 AM MYT','Jun 25 · 9:00 AM MYT','Jun 25 · 9:00 AM MYT'],
  // Group B: Jun 13, 14, 19, 25
  ['Jun 13 · 3:00 AM MYT','Jun 14 · 3:00 AM MYT','Jun 19 · 3:00 AM MYT','Jun 19 · 6:00 AM MYT','Jun 25 · 3:00 AM MYT','Jun 25 · 3:00 AM MYT'],
  // Group C: Jun 14, 20, 25
  ['Jun 14 · 6:00 AM MYT','Jun 14 · 9:00 AM MYT','Jun 20 · 6:00 AM MYT','Jun 20 · 8:30 AM MYT','Jun 25 · 6:00 AM MYT','Jun 25 · 6:00 AM MYT'],
  // Group D: Jun 13, 14, 20, 26
  ['Jun 13 · 9:00 AM MYT','Jun 14 · 12:00 PM MYT','Jun 20 · 3:00 AM MYT','Jun 20 · 11:00 AM MYT','Jun 26 · 10:00 AM MYT','Jun 26 · 10:00 AM MYT'],
  // Group E: Jun 15, 21, 26
  ['Jun 15 · 1:00 AM MYT','Jun 15 · 7:00 AM MYT','Jun 21 · 4:00 AM MYT','Jun 21 · 8:00 AM MYT','Jun 26 · 4:00 AM MYT','Jun 26 · 4:00 AM MYT'],
  // Group F: Jun 15, 21, 26
  ['Jun 15 · 4:00 AM MYT','Jun 15 · 10:00 AM MYT','Jun 21 · 1:00 AM MYT','Jun 21 · 12:00 PM MYT','Jun 26 · 7:00 AM MYT','Jun 26 · 7:00 AM MYT'],
  // Group G: Jun 16, 22, 27
  ['Jun 16 · 3:00 AM MYT','Jun 16 · 9:00 AM MYT','Jun 22 · 3:00 AM MYT','Jun 22 · 9:00 AM MYT','Jun 27 · 11:00 AM MYT','Jun 27 · 11:00 AM MYT'],
  // Group H: Jun 16, 22, 27
  ['Jun 16 · 12:00 AM MYT','Jun 16 · 6:00 AM MYT','Jun 22 · 12:00 AM MYT','Jun 22 · 6:00 AM MYT','Jun 27 · 8:00 AM MYT','Jun 27 · 8:00 AM MYT'],
  // Group I: Jun 17, 23, 27
  ['Jun 17 · 3:00 AM MYT','Jun 17 · 6:00 AM MYT','Jun 23 · 5:00 AM MYT','Jun 23 · 8:00 AM MYT','Jun 27 · 3:00 AM MYT','Jun 27 · 3:00 AM MYT'],
  // Group J: Jun 17, 23, 28
  ['Jun 17 · 9:00 AM MYT','Jun 17 · 12:00 PM MYT','Jun 23 · 1:00 AM MYT','Jun 23 · 11:00 AM MYT','Jun 28 · 10:00 AM MYT','Jun 28 · 10:00 AM MYT'],
  // Group K: Jun 18, 24, 28
  ['Jun 18 · 1:00 AM MYT','Jun 18 · 10:00 AM MYT','Jun 24 · 1:00 AM MYT','Jun 24 · 10:00 AM MYT','Jun 28 · 7:30 AM MYT','Jun 28 · 7:30 AM MYT'],
  // Group L: Jun 18, 24, 28
  ['Jun 18 · 4:00 AM MYT','Jun 18 · 7:00 AM MYT','Jun 24 · 4:00 AM MYT','Jun 24 · 7:00 AM MYT','Jun 28 · 5:00 AM MYT','Jun 28 · 5:00 AM MYT'],
];

// ---------- STATE ----------
let scores = {};
function initScores() {
  groups.forEach(g => { for(let m=0; m<6; m++) scores[g.name+'_'+m] = ['','']; });
  for(let i=1;i<=16;i++) { scores['R32_'+i]=['','']; scores['R32_'+i+'_et']=['','']; scores['R32_'+i+'_pen']=['','']; }
  for(let i=1;i<=8;i++)  { scores['R16_'+i]=['','']; scores['R16_'+i+'_et']=['','']; scores['R16_'+i+'_pen']=['','']; }
  for(let i=1;i<=4;i++)  { scores['QF_'+i]=['',''];  scores['QF_'+i+'_et']=['',''];  scores['QF_'+i+'_pen']=['','']; }
  for(let i=1;i<=2;i++)  { scores['SF_'+i]=['',''];  scores['SF_'+i+'_et']=['',''];  scores['SF_'+i+'_pen']=['','']; }
  scores['FIN']=['','']; scores['FIN_et']=['','']; scores['FIN_pen']=['',''];
  scores['3RD']=['','']; scores['3RD_et']=['','']; scores['3RD_pen']=['',''];
}
initScores();

// ---------- ASIAN HANDICAP ODDS ----------
let oddsMap = {};
let oddsLoading = false;

async function fetchOdds() {
  const btn = document.getElementById('oddsBtn');
  if (oddsLoading) return;
  oddsLoading = true;
  btn.innerHTML = '⏳ Odds';
  btn.style.opacity = '0.5';
  try {
    const res = await fetch(BACKEND_URL + '/api/odds');
    const data = await res.json();
    if (data.odds && data.odds.length) {
      oddsMap = {};
      for (const o of data.odds) {
        const label = o.ah_line;
        const src = o.source || o.bookmaker || '';
        oddsMap[o.home + '|' + o.away] = { line: label, src: src };
        oddsMap[o.away + '|' + o.home] = { line: label, src: src };
      }
      applyOdds();
    }
    btn.innerHTML = '🔄 Odds';
    btn.title = `Loaded ${data.count || 0} matches`;
    btn.style.opacity = '1';
  } catch (e) {
    btn.innerHTML = '⚠️ Odds';
    btn.title = 'Failed: ' + e.message;
    btn.style.opacity = '1';
    setTimeout(() => { btn.innerHTML = '🔄 Odds'; }, 3000);
  }
  oddsLoading = false;
}

function applyOdds() {
  document.querySelectorAll('.ah').forEach(el => {
    const home = el.dataset.home;
    const away = el.dataset.away;
    const key = home + '|' + away;
    const entry = oddsMap[key];
    if (entry) {
      el.innerHTML = '<span class="lv">AH ' + entry.line + '</span>';
    } else {
      el.innerHTML = '<span class="ld">--</span>';
    }
  });
}

// Override render to also apply odds after rendering
const _origRender = render;
render = function() {
  _origRender();
  applyOdds();
};

// ---------- GROUP STANDINGS ----------
function calcGroup(g) {
  let pts={},w={},d={},l={},gf={},ga={},pl={};
  g.teams.forEach(t=>{pts[t]=0;w[t]=0;d[t]=0;l[t]=0;gf[t]=0;ga[t]=0;pl[t]=0});
  for(let m=0; m<6; m++) {
    const sc = scores[g.name+'_'+m] || ['',''];
    const home = parseInt(sc[0]), away = parseInt(sc[1]);
    if(isNaN(home) || isNaN(away)) continue;
    const h = g.teams[pairings[m][0]], a = g.teams[pairings[m][1]];
    pl[h]++; pl[a]++; gf[h]+=home; ga[h]+=away; gf[a]+=away; ga[a]+=home;
    if(home > away) { pts[h]+=3; w[h]++; l[a]++; }
    else if(away > home) { pts[a]+=3; w[a]++; l[h]++; }
    else { pts[h]++; pts[a]++; d[h]++; d[a]++; }
  }
  return [...g.teams].sort((a,b) => {
    if(pts[b] !== pts[a]) return pts[b]-pts[a];
    const gda = gf[a]-ga[a], gdb = gf[b]-ga[b];
    return gdb !== gda ? gdb-gda : gf[b]-gf[a];
  }).map((t,i) => ({team:t,pos:i+1,pts:pts[t],w:w[t],d:d[t],l:l[t],gf:gf[t],ga:ga[t],gd:gf[t]-ga[t],pl:pl[t]}));
}

function groupDone(gName) {
  for(let m=0; m<6; m++) {
    const s = scores[gName+'_'+m] || ['',''];
    if(s[0]===''||s[1]==='') return false;
  }
  return true;
}

function groupTeam(gName, pos) {
  const g = groups.find(x=>x.name===gName);
  if(!g) return null;
  const r = calcGroup(g);
  return r[pos] ? r[pos].team : null;
}

// ---------- R32 MATCHES ----------
// Codes: "1 A" = group winner, "2 A" = runner-up, "3-ABCDE" = third-place slot
const R32_MATCHES = [
  {id:1, home:'2 A', away:'2 B'},           // M73  Los Angeles
  {id:2, home:'1 C', away:'2 F'},           // M76  Houston
  {id:3, home:'1 E', away:'3-ABCDF'},       // M74  Boston
  {id:4, home:'1 F', away:'2 C'},           // M75  Monterrey
  {id:5, home:'2 E', away:'2 I'},           // M78  Dallas
  {id:6, home:'1 I', away:'3-CDFGH'},       // M77  New York/New Jersey
  {id:7, home:'1 A', away:'3-CEFHI'},       // M79  Mexico City
  {id:8, home:'1 L', away:'3-EHIJK'},       // M80  Atlanta
  {id:9, home:'1 G', away:'3-AEHIJ'},       // M82  Seattle
  {id:10, home:'1 D', away:'3-BEFIJ'},      // M81  San Francisco Bay Area
  {id:11, home:'1 H', away:'2 J'},          // M84  Los Angeles
  {id:12, home:'2 K', away:'2 L'},          // M83  Toronto
  {id:13, home:'1 B', away:'3-EFGIJ'},      // M85  Vancouver
  {id:14, home:'2 D', away:'2 G'},          // M88  Dallas
  {id:15, home:'1 J', away:'2 H'},          // M86  Miami
  {id:16, home:'1 K', away:'3-DEIJL'},      // M87  Kansas City
];

// Bracket connections: which R32 matches feed into each R16 match
const R16_SRC = [[1,4],[3,6],[2,5],[7,8],[10,9],[12,11],[13,16],[15,14]];
// QF from R16 match numbers
const QF_SRC = [[2,1],[5,6],[3,4],[7,8]];
// SF from QF match numbers
const SF_SRC = [[1,2],[3,4]];

// ---------- THIRD-PLACED ASSIGNMENT ----------

// Rank all 12 third-placed teams and return which groups' third places advance
function rankThirdPlaced() {
  const groupNames = 'ABCDEFGHIJKL'.split('');
  let results = [];
  groupNames.forEach(n => {
    const g = groups.find(x=>x.name===n);
    if(!g) return;
    const r = calcGroup(g);
    if(r[2]) {
      const t = r[2];
      results.push({group:n, team:t.team, pts:t.pts, gd:t.gd, gf:t.gf});
    }
  });
  // Sort by Pts > GD > GF
  results.sort((a,b) => b.pts-a.pts || b.gd-a.gd || b.gf-a.gf);
  return results;
}

// Get which groups' third-placed teams are eliminated (bottom 4)
function getEliminatedThirdGroups() {
  const ranked = rankThirdPlaced();
  const advancing = ranked.slice(0, 8);
  const eliminated = ranked.slice(8);
  return eliminated.map(r => r.group).sort().join('');
}

// Resolve a third-placed slot code like "3-ABCDF" to the actual group letter
function resolveThirdSlot(slotCode) {
  if(!slotCode.startsWith('3-')) return slotCode;
  const elimKey = getEliminatedThirdGroups();
  const assignment = THIRD_MAP[elimKey];
  if(!assignment) return null; // caller falls back to spec label
  const slots = ['3-CEFHI','3-EFGIJ','3-BEFIJ','3-ABCDF','3-AEHIJ','3-CDFGH','3-DEIJL','3-EHIJK'];
  const idx = slots.indexOf(slotCode);
  if(idx === -1 || idx >= assignment.length) return null;
  const groupLetter = assignment[idx];
  const g = groups.find(x=>x.name===groupLetter);
  if(!g || !groupDone(groupLetter)) return null;
  const r = calcGroup(g);
  return r[2] ? r[2].team : null;
}

// Check if all 12 groups are done
function allGroupsDone() {
  return 'ABCDEFGHIJKL'.split('').every(n => groupDone(n));
}

function getR32Team(id) {
  const m = R32_MATCHES.find(x=>x.id===id);
  if(!m) return {h:'TBD',a:'TBD'};
  const h = resolveR32Spec(m.home);
  const a = resolveR32Spec(m.away);
  return {h:h||m.home, a:a||m.away};
}

function resolveR32Spec(spec) {
  let mm = spec.match(/^(\d)\s+(\w)$/);
  if(mm) {
    if(!groupDone(mm[2])) return null; // caller falls back to spec label
    return groupTeam(mm[2], parseInt(mm[1])-1);
  }
  mm = spec.match(/^3-(\w+)$/);
  if(mm) {
    if(!allGroupsDone()) return null;
    return resolveThirdSlot(spec);
  }
  return spec;
}

function getWinner(round, id) {
  const key = round+'_'+id;
  const t = getTeams(round, id);
  if(!t || !t.h || !t.a) return null;
  const s = scores[key] || ['',''];
  const h = parseInt(s[0]), a = parseInt(s[1]);
  if(!isNaN(h) && !isNaN(a) && h!==a) return h>a ? t.h : t.a;
  const et = scores[key+'_et'] || ['',''];
  const h2 = parseInt(et[0]), a2 = parseInt(et[1]);
  if(!isNaN(h2) && !isNaN(a2) && h2!==a2) return h2>a2 ? t.h : t.a;
  const pn = scores[key+'_pen'] || ['',''];
  const h3 = parseInt(pn[0]), a3 = parseInt(pn[1]);
  if(!isNaN(h3) && !isNaN(a3) && h3!==a3) return h3>a3 ? t.h : t.a;
  return null;
}

function getTeams(round, id) {
  if(round === 'R32') return getR32Team(id);
  
  let src;
  if(round === 'R16') src = R16_SRC[id-1];
  else if(round === 'QF')  src = QF_SRC[id-1];
  else if(round === 'SF')  src = SF_SRC[id-1];
  else if(round === 'FIN' || round === '3RD') {
    // FIN and 3RD get their teams from SF
    src = [1,2];
    if(round === '3RD') src = [1,2]; // losers of SF
  }
  if(!src) return {h:'TBD',a:'TBD'};
  
  // Previous round
  const prev = {R16:'R32', QF:'R16', SF:'QF', FIN:'SF', '3RD':'SF'};
  const pr = prev[round];
  if(!pr) return {h:'TBD',a:'TBD'};
  
  const w1 = getWinner(pr, src[0]);
  const w2 = getWinner(pr, src[1]);
  
  // For 3RD place match, we need the LOSERS of the SFs
  if(round === '3RD') {
    const t1 = getTeams(pr, src[0]);
    const t2 = getTeams(pr, src[1]);
    const s1 = scores[pr+'_'+src[0]] || ['',''];
    const s2 = scores[pr+'_'+src[1]] || ['',''];
    let h1 = parseInt(s1[0]), a1 = parseInt(s1[1]);
    let h2 = parseInt(s2[0]), a2 = parseInt(s2[1]);
    if(isNaN(h1)||isNaN(a1)||h1===a1) { const e1=scores[pr+'_'+src[0]+'_et']||['','']; h1=parseInt(e1[0]); a1=parseInt(e1[1]); }
    if(isNaN(h1)||isNaN(a1)||h1===a1) { const p1=scores[pr+'_'+src[0]+'_pen']||['','']; h1=parseInt(p1[0]); a1=parseInt(p1[1]); }
    if(isNaN(h2)||isNaN(a2)||h2===a2) { const e2=scores[pr+'_'+src[1]+'_et']||['','']; h2=parseInt(e2[0]); a2=parseInt(e2[1]); }
    if(isNaN(h2)||isNaN(a2)||h2===a2) { const p2=scores[pr+'_'+src[1]+'_pen']||['','']; h2=parseInt(p2[0]); a2=parseInt(p2[1]); }

    let l1 = 'L '+pr+'-'+src[0], l2 = 'L '+pr+'-'+src[1];
    if(!isNaN(h1)&&!isNaN(a1)&&h1!==a1) l1 = h1>a1 ? t1.a : t1.h;
    if(!isNaN(h2)&&!isNaN(a2)&&h2!==a2) l2 = h2>a2 ? t2.a : t2.h;
    return {h:l1, a:l2};
  }
  
  return {h:w1||'W '+pr+'-'+src[0], a:w2||'W '+pr+'-'+src[1]};
}

function getAllMatches() {
  const list = [];
  groups.forEach((g, gi) => {
    for (let m = 0; m < 6; m++) {
      const k = g.name+'_'+m;
      const home = g.teams[pairings[m][0]];
      const away = g.teams[pairings[m][1]];
      const ts = getMatchTs(gi, m);
      const sc = scores[k];
      const played = sc && sc[0] !== '' && sc[1] !== '';
      list.push({ ts, home, away, key: k, played, round: 'Group '+g.name, group: true });
    }
  });
  return list;
}

function renderNextMatches() {
  const el = document.getElementById('nextRow');
  const p = document.getElementById('nextMatches');
  if (!el || !p) return;

  const all = getAllMatches().filter(m => !m.played).sort((a, b) => a.ts - b.ts);
  const next = all.slice(0, 4);

  if (next.length === 0) { p.style.display = 'none'; return; }
  p.style.display = '';

  el.innerHTML = next.map(m => {
    const now = Date.now();
    const diff = m.ts - now;
    let cd, cls = '';
    if (diff <= 0 && diff > -110 * 60000) { cd = '🔴 LIVE'; cls = 'lv'; }
    else if (diff <= -110 * 60000) { cd = '✅ FT'; cls = 'ft'; }
    else if (diff < 3600000) { cd = '⏳ ' + Math.floor(diff/60000) + 'm'; }
    else if (diff < 86400000) { cd = '⏳ ' + Math.floor(diff/3600000) + 'h ' + Math.floor((diff%3600000)/60000) + 'm'; }
    else { cd = '⏳ ' + Math.floor(diff/86400000) + 'd ' + Math.floor((diff%86400000)/3600000) + 'h'; }
    return `<div class="nc"><div class="ncd ${cls}">${cd}</div>` +
      `<div class="nteams">${flags[m.home]||''} ${m.home}<br>${flags[m.away]||''} ${m.away}</div>` +
      `<div class="ninfo">📋 ${m.round}</div></div>`;
  }).join('');
}

// ---------- RENDER ----------
function render() {
  renderGroups();
  renderBracket();
  renderNextMatches();
  updateCountdowns();
  autoSave();
}

function autoSave() {
  try { localStorage.setItem('wc26', JSON.stringify(scores)); } catch(e) {}
}

function renderGroups() {
  const c = document.getElementById('groupsContainer');
  c.innerHTML = '';
  
  groups.forEach((g, gi) => {
    const r = calcGroup(g);
    let done = true, any = false;
    for(let m=0; m<6; m++) {
      const s = scores[g.name+'_'+m]||['',''];
      if(s[0]===''||s[1]==='') done=false;
      if(s[0]!==''||s[1]!=='') any=true;
    }
    
    let html = `<div class="gh"><div><h3>${flags[g.teams[0]]||''} Group ${g.name}</h3></div><span class="st ${done?'s2':(any?'s1':'s0')}">${done?'✅ Done':(any?'▶ Live':'⏳ Pending')}</span></div>`;
    html += `<table><thead><tr><th>Team</th><th>MP</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th></tr></thead><tbody>`;
    
    r.forEach(s => {
      let rc='r0', pn='4', pc='p4';
      if(s.pos===1){rc='r1';pn='1';pc='p1';}
      else if(s.pos===2){rc='r2';pn='2';pc='p2';}
      else if(s.pos===3){rc='r3';pn='3';pc='p3';}
      html += `<tr class="${rc}"><td><span class="pb ${pc}">${pn}</span>${flags[s.team]||''} ${s.team}</td><td>${s.pl}</td><td>${s.w}</td><td>${s.d}</td><td>${s.l}</td><td>${s.gf}</td><td>${s.ga}</td><td>${s.gd>0?'+':''}${s.gd}</td><td style="font-weight:700;color:${s.pts>=6?'#4ade80':s.pts>=3?'#facc15':'#f87171'}">${s.pts}</td></tr>`;
    });
    
    html += `</tbody></table><div class="ms"><h4>📅 Matches</h4>`;
    for(let m=0; m<6; m++) {
      const k = g.name+'_'+m;
      const home = g.teams[pairings[m][0]], away = g.teams[pairings[m][1]];
      const sc = scores[k]||['',''];
      const played = sc[0]!==''&&sc[1]!=='';
html += `<div class="mr"><div class="mt" style="text-align:right">${flags[home]||''} ${home}</div>`;
html += `<input class="mi" value="${sc[0]}" placeholder="-" maxlength="2" oninput="onGroupScore('${k}',0,this.value)">`;
html += `<span class="mv">vs</span>`;
html += `<input class="mi" value="${sc[1]}" placeholder="-" maxlength="2" oninput="onGroupScore('${k}',1,this.value)">`;
html += `<div class="mt">${flags[away]||''} ${away}</div><div class="dt">📆 ${MATCH_TIMES[gi][m]}</div>`;
html += `<div class="cd" data-ts="${getMatchTs(gi,m)}" data-key="${k}">⏳ --</div>`;
html += `<div class="ah" data-home="${home}" data-away="${away}">--</div></div>`;
    }
    html += `</div>`;
    
    const div = document.createElement('div'); div.className = 'gc'; div.innerHTML = html;
    c.appendChild(div);
  });
}

function onGroupScore(k, idx, val) {
  val = val.replace(/[^0-9]/g,'');
  if(!scores[k]) scores[k] = ['',''];
  scores[k][idx] = val;
  render();
  try { localStorage.setItem('wc26', JSON.stringify(scores)); } catch(e) {}
}

function filterGroups(q) {
  q = q.toLowerCase().trim();
  document.querySelectorAll('.gc').forEach(el => {
    el.style.display = (!q || el.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
}

function renderBracket() {
  const br = document.getElementById('bracket');
  br.innerHTML = '';
  
  const roundDefs = [
    {key:'R32', label:'Round of 32', count:16, dates:'Jun 29 – Jul 4'},
    {key:'R16', label:'Round of 16', count:8, dates:'Jul 5–8'},
    {key:'QF',  label:'Quarter-finals', count:4, dates:'Jul 10–12'},
    {key:'SF',  label:'Semi-finals', count:2, dates:'Jul 15–16'},
    {key:'FIN', label:'🏆 FINAL', count:1, dates:'Jul 20', fin:true},
    {key:'3RD', label:'🥉 3rd Place', count:1, dates:'Jul 19'},
  ];
  
  roundDefs.forEach(rd => {
    const col = document.createElement('div'); col.className = 'rd';
    let html = `<h5>${rd.label}</h5><div class="hi">${rd.dates}</div>`;
    
    for(let i=1; i<=rd.count; i++) {
      const teams = getTeams(rd.key, i);
      const key = rd.key === 'FIN' ? 'FIN' : (rd.key === '3RD' ? '3RD' : rd.key+'_'+i);
      const sc = scores[key] || ['',''];
      const etc = scores[key+'_et'] || ['',''];
      const psc = scores[key+'_pen'] || ['',''];
      const hN = parseInt(sc[0]), aN = parseInt(sc[1]);
      const hET = parseInt(etc[0]), aET = parseInt(etc[1]);
      const hPN = parseInt(psc[0]), aPN = parseInt(psc[1]);
      const regPlayed = !isNaN(hN) && !isNaN(aN);
      const etPlayed = !isNaN(hET) && !isNaN(aET);
      const penPlayed = !isNaN(hPN) && !isNaN(aPN);
      
      // Determine winner
      let hW=false, aW=false;
      if(regPlayed && hN!==aN) { hW=hN>aN; aW=aN>hN; }
      else if(etPlayed && hET!==aET) { hW=hET>aET; aW=aET>hET; }
      else if(penPlayed && hPN!==aPN) { hW=hPN>aPN; aW=aPN>hPN; }
      
      const isDraw90 = regPlayed && hN===aN;
      const isDrawET = etPlayed && hET===aET;
      
const koTime = KO_TIMES[rd.key] && KO_TIMES[rd.key][i-1] ? KO_TIMES[rd.key][i-1] : '';
const koTS = getKOTs(rd.key, i);
html += `<div class="bm${rd.fin?' fn':''}>
  ${koTime ? `<div class="dt" style="padding-bottom:3px;border-bottom:1px solid #0a0f1c;margin-bottom:3px;">📆 ${koTime}</div>` : ''}
  <div class="cd" data-ts="${koTS}" data-key="${key}">⏳ --</div>
  <div class="bt${hW?' w':(aW?' l':'')}"><span class="nm">${teams.h}</span>
          <input class="bi" value="${sc[0]}" placeholder="-" maxlength="2" oninput="onKOScore('${key}',0,this.value)"></div>
        <div class="bt${aW?' w':(hW?' l':'')}"><span class="nm">${teams.a}</span>
          <input class="bi" value="${sc[1]}" placeholder="-" maxlength="2" oninput="onKOScore('${key}',1,this.value)"></div>`;
      
      // ET row
      if(isDraw90 || etPlayed) {
        const etLabel = penPlayed ? 'ET (draw)' : (isDraw90 ? '⚡ Extra Time' : 'ET');
        html += `<div class="bt" style="font-size:.6rem;color:#64748b;justify-content:center;gap:4px;">
          <span>${etLabel}</span>
          <input class="bi" value="${etPlayed?etc[0]:''}" placeholder="-" maxlength="2" style="width:22px;height:20px;font-size:.6rem;" oninput="onKOScore('${key}_et',0,this.value)">
          <span>-</span>
          <input class="bi" value="${etPlayed?etc[1]:''}" placeholder="-" maxlength="2" style="width:22px;height:20px;font-size:.6rem;" oninput="onKOScore('${key}_et',1,this.value)">
        </div>`;
        
        // PEN row
        if(isDrawET || penPlayed) {
          html += `<div class="bt" style="font-size:.6rem;color:#f59e0b;justify-content:center;gap:4px;">
            <span>🎯 Pens</span>
            <input class="bi${penPlayed?' gd':''}" value="${penPlayed?psc[0]:''}" placeholder="-" maxlength="2" style="width:22px;height:20px;font-size:.6rem;" oninput="onKOScore('${key}_pen',0,this.value)">
            <span>-</span>
            <input class="bi${penPlayed?' gd':''}" value="${penPlayed?psc[1]:''}" placeholder="-" maxlength="2" style="width:22px;height:20px;font-size:.6rem;" oninput="onKOScore('${key}_pen',1,this.value)">
          </div>`;
        }
      }
      
      html += `</div>`;
    }
    
    col.innerHTML = html;
    br.appendChild(col);
  });
  
  // Champion banner
  const fs = scores['FIN'] || ['',''];
  let fh = parseInt(fs[0]), fa = parseInt(fs[1]);
  if(isNaN(fh)||isNaN(fa)||fh===fa) { const fet=scores['FIN_et']||['','']; fh=parseInt(fet[0]); fa=parseInt(fet[1]); }
  if(isNaN(fh)||isNaN(fa)||fh===fa) { const fpn=scores['FIN_pen']||['','']; fh=parseInt(fpn[0]); fa=parseInt(fpn[1]); }
  const ch = document.getElementById('champion');
  const cn = document.getElementById('champName');
  if(!isNaN(fh) && !isNaN(fa) && fh !== fa) {
    const ft = getTeams('FIN', 1);
    const w = fh > fa ? ft.h : ft.a;
    if(w && w !== 'TBD') { cn.textContent = w + koWonHow('FIN'); ch.classList.add('on'); return; }
  }
  ch.classList.remove('on');
}

function onKOScore(key, idx, val) {
  val = val.replace(/[^0-9]/g,'');
  if(!scores[key]) scores[key] = ['',''];
  scores[key][idx] = val;
  render();
  try { localStorage.setItem('wc26', JSON.stringify(scores)); } catch(e) {}
}

function koWonHow(key) {
  const s = scores[key] || ['',''];
  const h = parseInt(s[0]), a = parseInt(s[1]);
  if(!isNaN(h) && !isNaN(a) && h!==a) return '';
  const et = scores[key+'_et'] || ['',''];
  const h2 = parseInt(et[0]), a2 = parseInt(et[1]);
  if(!isNaN(h2) && !isNaN(a2) && h2!==a2) return ' ⚡ET';
  const pn = scores[key+'_pen'] || ['',''];
  const h3 = parseInt(pn[0]), a3 = parseInt(pn[1]);
  if(!isNaN(h3) && !isNaN(a3) && h3!==a3) return ' 🎯Pens';
  return '';
}

// ---------- LIVE CLOCK ----------
function updateClock() {
  const el = document.getElementById('clock');
  if (!el) return;
  const d = new Date();
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const pad = n => String(n).padStart(2, '0');
  const str = `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()} · ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  el.innerHTML = `📍 <span class="tm">${str}</span>`;
}
setInterval(updateClock, 1000);
updateClock();

// ---------- TIME PARSING ----------
function parseMYT(str) {
  const months = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const m = str.match(/(\w+)\s+(\d+)\s*·\s*(\d+):(\d+)\s*(AM|PM)\s*MYT/);
  if (!m) return 0;
  let h = parseInt(m[3]);
  const min = parseInt(m[4]);
  if (m[5] === 'PM' && h !== 12) h += 12;
  if (m[5] === 'AM' && h === 12) h = 0;
  return Date.UTC(2026, months[m[1]], parseInt(m[2]), h - 8, min);
}

function getMatchTs(gi, mi) {
  return parseMYT(MATCH_TIMES[gi][mi]);
}

function getKOTs(round, idx) {
  const t = KO_TIMES[round] && KO_TIMES[round][idx - 1];
  if (!t) return 0;
  return parseMYT(t);
}

// ---------- COUNTDOWN UPDATER ----------
function getCountdownStr(ts, key) {
  if (!ts || ts === 0) return '';
  const now = Date.now();
  const diff = ts - now;
  const sc = scores[key];
  const played = sc && sc[0] !== '' && sc[1] !== '';

  if (played) return '✅ FT';
  if (diff <= -110 * 60 * 1000) return '✅ FT';
  if (diff <= 0) return '<span class="lv">🔴 LIVE</span>';
  if (diff < 3600000) {
    const m = Math.floor(diff / 60000);
    return `⏳ ${m}m`;
  }
  if (diff < 86400000) {
    const h = Math.floor(diff / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    return `⏳ ${h}h ${m}m`;
  }
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  return `⏳ ${d}d ${h}h`;
}

function updateCountdowns() {
  document.querySelectorAll('.cd').forEach(el => {
    const ts = parseInt(el.dataset.ts);
    const key = el.dataset.key || '';
    if (!ts) { el.innerHTML = ''; return; }
    el.innerHTML = getCountdownStr(ts, key);
    el.className = 'cd';
    const now = Date.now();
    if (ts <= now && ts > now - 110 * 60000) el.classList.add('lv');
    else if (ts <= now) el.classList.add('ft');
  });
  renderNextMatches();
}
setInterval(updateCountdowns, 60000);
setTimeout(updateCountdowns, 100);

};

function norm(n) {
  const key = n.trim().toLowerCase();
  return NAME_ALIASES[key] || n.trim();
}

const OUR_TEAMS = new Set(Object.values(NAME_ALIASES));

// ---------- MATCH MATCHING ----------
function findGroupMatch(home, away) {
  for (let gi = 0; gi < groups.length; gi++) {
    const g = groups[gi];
    for (let mi = 0; mi < 6; mi++) {
      const gh = g.teams[pairings[mi][0]];
      const ga = g.teams[pairings[mi][1]];
      if ((gh === home && ga === away) || (gh === away && ga === home)) {
        return { gi, mi, key: g.name + '_' + mi };
      }
    }
  }
  return null;
}

function findKOMatch(home, away) {
  const rounds = ['R32', 'R16', 'QF', 'SF', 'FIN', '3RD'];
  for (const r of rounds) {
    const count = r === 'FIN' || r === '3RD' ? 1 : (r === 'SF' ? 2 : (r === 'QF' ? 4 : (r === 'R16' ? 8 : 16)));
    for (let i = 1; i <= count; i++) {
      const key = r === 'FIN' ? 'FIN' : (r === '3RD' ? '3RD' : r + '_' + i);
      const teams = getTeams(r, i);
      if (!teams || teams.h === 'TBD' || teams.a === 'TBD') continue;
      if ((norm(teams.h) === home && norm(teams.a) === away) || (norm(teams.h) === away && norm(teams.a) === home)) {
        return { round: r, idx: i, key };
      }
    }
  }
  return null;
}

// ---------- POLL BACKEND ----------
async function pollBackend() {
  const dot = document.getElementById('statusDot');
  if (!dot) return;

  try {
    const res = await fetch(`${BACKEND_URL}/api/matches`);
    if (!res.ok) throw new Error(`${res.status}`);
    const data = await res.json();

    if (!data.matches || data.matches.length === 0) {
      dot.className = 'sd y';
      dot.title = 'No data available — enter scores manually';
      return;
    }

    applyMatches(data.matches);

    const liveCount = data.matches.filter(m => m.status === 'LIVE').length;
    if (data.source === 'simulation') {
      dot.className = 'sd y';
      dot.title = `Simulated — ${liveCount} live | refresh to re-generate`;
    } else {
      dot.className = 'sd g';
      dot.title = `Live — ${data.source} | ${liveCount} live matches`;
    }

  } catch (e) {
    dot.className = 'sd r';
    dot.title = `Offline — ${e.message}`;
  }
}

function applyMatches(apiMatches) {
  let changed = false;

  for (const m of apiMatches) {
    const home = norm(m.home);
    const away = norm(m.away);
    if (!OUR_TEAMS.has(home) || !OUR_TEAMS.has(away)) continue;

    // Try group match first
    let match = findGroupMatch(home, away);
    let key = match ? match.key : null;

    if (!key) {
      // Try KO match
      const ko = findKOMatch(home, away);
      key = ko ? ko.key : null;
    }

    if (!key) continue;

    if (m.homeScore !== null && m.awayScore !== null) {
      const cur = scores[key];
      const hs = String(m.homeScore), as = String(m.awayScore);
      if (!cur || cur[0] !== hs || cur[1] !== as) {
        if (!scores[key]) scores[key] = ['', ''];
        scores[key][0] = hs;
        scores[key][1] = as;
        changed = true;
      }
    }
  }

  if (changed) {
    render();
    try { localStorage.setItem('wc26', JSON.stringify(scores)); } catch (e) {}
  }
}
